<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 120px;
        height: 160px;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #bubble {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border-radius: 10px;
        border: 1px solid #ddd;
        padding: 5px 8px;
        font-size: 11px;
        font-family: sans-serif;
        white-space: nowrap;
        max-width: 110px;
        white-space: normal;
        word-break: keep-all;
        display: none;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      #mascot {
        width: 80px;
        height: 80px;
        background: rgba(100, 200, 100, 0.8);
        border-radius: 50%;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <div id="mascot">🐸</div>

    <script>
      const userId = "temp-user";
      const bubble = document.getElementById("bubble");
      const mascot = document.getElementById("mascot");
      const messageQueue = [];
      let isShowing = false;

      // 메뉴 열기
      mascot.addEventListener("click", () => {
        window.electron.openMenu(userId);
      });

      // 말풍선 큐 처리
      window.electron.onShowBubble((data) => {
        console.log("show-bubble 수신:", data);
        messageQueue.push(data.text);
        if (!isShowing) processQueue();
      });

      function processQueue() {
        if (messageQueue.length === 0) {
          isShowing = false;
          return;
        }

        isShowing = true;
        const text = messageQueue.shift();
        bubble.textContent = text;
        bubble.style.display = "block";

        setTimeout(() => {
          bubble.style.display = "none";
          setTimeout(processQueue, 300);
        }, 3000);
      }
    </script>
  </body>
</html>
