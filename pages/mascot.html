<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: max-content;
        height: max-content;
        background: rgba(255, 255, 255, 0.5);
        overflow: hidden;
        user-select: none;
      }
      #bubble {
        position: absolute;
        bottom: 90px; /* 마스코트 높이 + 간격 */
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border-radius: 10px;
        border: 1px solid #ddd;
        padding: 4px 8px;
        font-size: 11px;
        font-family: sans-serif;
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 200px;
        width: max-content;
        display: none;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      #mascot {
        width: 80px;
        height: 80px;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        cursor: pointer;
        image-rendering: pixelated;
      }
      #login-btn {
        position: absolute;
        bottom: 100px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        background: #4285f4;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 11px;
        font-family: sans-serif;
        cursor: pointer;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <button id="login-btn">Google 로그인</button>
    <img id="mascot" src="../assets/frog/idle_1.png" style="display: none" />

    <script>
      const userId = "temp-user";
      const mascotImg = document.getElementById("mascot");
      let isJumping = false;

      // idle 애니메이션 (1↔2 번갈아가며)
      const idleFrames = [
        "../assets/frog/idle_1.png",
        "../assets/frog/idle_2.png",
      ];
      let idleIndex = 0;

      const idleInterval = setInterval(() => {
        if (!isJumping) {
          mascotImg.src = idleFrames[idleIndex];
          idleIndex = (idleIndex + 1) % idleFrames.length;
        }
      }, 400);

      // click 시 jump 애니메이션
      const jumpFrames = [
        "../assets/frog/jump_1.png",
        "../assets/frog/jump_2.png",
      ];

      mascotImg.addEventListener("click", () => {
        if (isJumping) return;
        isJumping = true;

        let jumpIndex = 0;
        const jumpInterval = setInterval(() => {
          mascotImg.src = jumpFrames[jumpIndex];
          jumpIndex++;
          if (jumpIndex >= jumpFrames.length) {
            clearInterval(jumpInterval);
            isJumping = false;
          }
        }, 150);
      });

      const bubble = document.getElementById("bubble");
      const mascot = document.getElementById("mascot");
      const messageQueue = [];
      let isShowing = false;

      // 메뉴 열기
      mascot.addEventListener("click", () => {
        window.electron.openMenu(userId);
      });

      // 말풍선 큐 처리
      window.electron.onShowBubble((data) => {
        console.log("show-bubble 수신:", data);
        messageQueue.push(data.text);
        if (!isShowing) processQueue();
      });

      function processQueue() {
        if (messageQueue.length === 0) {
          isShowing = false;
          return;
        }

        isShowing = true;
        let text = messageQueue.shift();
        if (text.length > 50) text = text.substring(0, 50) + "...";

        bubble.textContent = text;
        bubble.style.display = "block";

        setTimeout(() => {
          bubble.style.display = "none";
          setTimeout(processQueue, 300);
        }, 3000);
      }

      // 로그인 버튼
      const loginBtn = document.getElementById("login-btn");
      loginBtn.addEventListener("click", () => {
        window.electron.openLogin();
      });

      // 로그인 성공 시 버튼 숨기고 개구리 표시
      window.electron.onLoginSuccess(() => {
        loginBtn.style.display = "none";
        mascotImg.style.display = "block";
      });
    </script>
  </body>
</html>
