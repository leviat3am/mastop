<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: max-content;
        height: max-content;
        background: rgba(255, 255, 255, 0.5);
        overflow: hidden;
        user-select: none;
      }
      #bubble {
        position: absolute;
        bottom: 90px; /* 마스코트 높이 + 간격 */
        left: 50%;
        transform: translateX(-50%);
        background: white;
        border-radius: 10px;
        border: 1px solid #ddd;
        padding: 4px 8px;
        font-size: 11px;
        font-family: sans-serif;
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 200px;
        width: max-content;
        display: none;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      #mascot {
        width: 80px;
        height: 80px;
        background: rgba(100, 200, 100, 0.8);
        border-radius: 50%;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <img
      id="mascot"
      src="../assets/idle_1.png"
      style="
        width: 80px;
        height: 80px;
        object-fit: contain;
        image-rendering: pixelated;
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        cursor: pointer;
      "
    />

    <script>
      const userId = "temp-user";
      const mascotImg = document.getElementById("mascot");
      let isJumping = false;

      // idle 애니메이션 (1↔2 번갈아가며)
      const idleFrames = ["../assets/idle_1.png", "../assets/idle_2.png"];
      let idleIndex = 0;

      const idleInterval = setInterval(() => {
        if (!isJumping) {
          mascotImg.src = idleFrames[idleIndex];
          idleIndex = (idleIndex + 1) % idleFrames.length;
        }
      }, 400);

      // click 시 jump 애니메이션
      const jumpFrames = [
        "../assets/jump_1.png",
        "../assets/jump_2.png",
        "../assets/jump_3.png",
      ];

      mascotImg.addEventListener("click", () => {
        if (isJumping) return;
        isJumping = true;

        let jumpIndex = 0;
        const jumpInterval = setInterval(() => {
          mascotImg.src = jumpFrames[jumpIndex];
          jumpIndex++;
          if (jumpIndex >= jumpFrames.length) {
            clearInterval(jumpInterval);
            isJumping = false;
          }
        }, 150);

        window.electron.openMenu(userId);
      });

      const bubble = document.getElementById("bubble");
      const mascot = document.getElementById("mascot");
      const messageQueue = [];
      let isShowing = false;

      // 메뉴 열기
      mascot.addEventListener("click", () => {
        window.electron.openMenu(userId);
      });

      // 말풍선 큐 처리
      window.electron.onShowBubble((data) => {
        console.log("show-bubble 수신:", data);
        messageQueue.push(data.text);
        if (!isShowing) processQueue();
      });

      function processQueue() {
        if (messageQueue.length === 0) {
          isShowing = false;
          return;
        }

        isShowing = true;
        let text = messageQueue.shift();
        if (text.length > 50) text = text.substring(0, 50) + "...";

        bubble.textContent = text;
        bubble.style.display = "block";

        setTimeout(() => {
          bubble.style.display = "none";
          setTimeout(processQueue, 300);
        }, 3000);
      }

      // 테스트용 - 3초 후 버블 강제 표시
      setTimeout(() => {
        messageQueue.push("어쩔티비");
        if (!isShowing) processQueue();
      }, 1000);
    </script>
  </body>
</html>
