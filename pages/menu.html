<!doctype html>
<html>
  <head>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: transparent;
        overflow: hidden;
        font-family: sans-serif;
        font-size: 13px;
      }
      .item {
        padding: 10px 16px;
        cursor: pointer;
        background-color: white;
      }
      .item:hover {
        background: #f5f5f5;
      }
      .item:last-child {
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="item">💬 대화 내역 보기</div>
    <div class="item">🎨 캐릭터 꾸미기</div>
    <div class="item">🔔 알림 설정</div>
    <div class="item">👁️ 숨기기</div>
  </body>
</html>
